name: update-aqua-checksum
on:
  pull_request:
    paths:
      - aqua.yaml
      - aqua-checksums.json
      - .github/workflows/update-aqua-checksum.yaml

env:
  AQUA_LOG_COLOR: always

jobs:
  update-aqua-checksums:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 30
    steps:
      - name: Generate token (octo-sts)
        if: ${{ ! github.event.pull_request.head.repo.fork }}
        id: octo-sts
        uses: octo-sts/action@v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: create_pull_request

      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install aqua
        uses: aquaproj/aqua-installer@v4.0.4
        with:
          aqua_version: v2.59.1
        env:
          AQUA_GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token || github.token }}

      - name: Update checksum
        uses: aquaproj/update-checksum-action@v0.2.7
        with:
          prune: true
          skip_push: ${{ github.event.pull_request.head.repo.fork }}
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
          AQUA_GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token || github.token }}
