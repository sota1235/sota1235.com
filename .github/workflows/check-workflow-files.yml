name: Check workflow files

on:
  pull_request:
    paths:
      - .github/workflows/*
      - .github/actions/*
      - aqua.yaml

jobs:
  check-workflow-files:
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setting up aqua
        uses: aquaproj/aqua-installer@b8be739961814ee66b9e0d505f4d5de0d2eff047 # v4.1.2
        with:
          aqua_version: v2.66.1

      - name: Run actionlint
        run: actionlint

      - name: Run ghalint
        run: |
          ghalint run
          ghalint run-action
